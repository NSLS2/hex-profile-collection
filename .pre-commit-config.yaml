repos:
  - repo: local
    hooks:
      - id: check-yaml
        name: check yaml
        entry: check-yaml
        language: system
        types: [yaml]
      - id: end-of-file-fixer
        name: fix end of files
        entry: end-of-file-fixer
        language: system
        types: [text]
        stages: [pre-commit, pre-push, manual]
      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: trailing-whitespace-fixer
        language: system
        types: [text]
        stages: [pre-commit, pre-push, manual]
      - id: black
        name: black
        entry: black
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: isort
        name: isort
        entry: isort
        language: system
        types_or: [cython, pyi, python]
        stages: [pre-commit, pre-merge-commit, pre-push, manual]
        require_serial: true
        args: ["--profile", "black", "--filter-files", "--line-length", "88"]
      - id: nbstripout
        name: nbstripout
        entry: nbstripout
        language: system
        types: [jupyter]
